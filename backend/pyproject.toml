[project]
name = "vre-backend"
version = "0.1.0"
description = "Walkthrough to Listing API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "openai>=3.35.1",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
exclude-newer = "2026-10-19T00:00:00Z"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
]
